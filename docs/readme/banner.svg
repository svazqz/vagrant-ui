<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="project-title project-description">
  <title id="project-title">Vagrant UI</title>
  <desc id="project-description">A desktop interface for Vagrant.</desc>
  <defs>
    <linearGradient id="background">
      <stop offset="0" stop-color="#271F1A"/>
      <stop offset="1" stop-color="#54382B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFD389" stop-opacity=".23"/>
      <stop offset="1" stop-color="#FFD389" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#E0A663" opacity=".38"/>
    </pattern>
    <linearGradient id="accent">
      <stop stop-color="#FFD389"/><stop offset="1" stop-color="#E0A663" stop-opacity=".26"/>
    </linearGradient>
    <clipPath id="corners"><rect x="1" y="1" width="1198" height="258" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#corners)">
    <rect width="1200" height="260" fill="url(#background)"/>
    <ellipse cx="1016" cy="125" rx="299" ry="204" fill="url(#glow)"/>
    <rect x="803" width="397" height="260" fill="url(#dots)" opacity=".51"/>
    <path d="M769 224h77l41-42h83M807 55h81l27 27h118m-92 94h128l45-45h102" fill="none" stroke="#E0A663" stroke-opacity=".29" stroke-width="2"/>
    <circle cx="845" cy="224" r="4" fill="#FFD389" opacity=".76"/>
    <circle cx="887" cy="55" r="4" fill="#FFD389" opacity=".76"/>
    <circle cx="1114" cy="131" r="4" fill="#FFD389" opacity=".76"/>
    <rect x="932" y="40" width="170" height="170" rx="31" fill="#271F1A" fill-opacity=".86" stroke="#E0A663" stroke-opacity=".56"/>
    <rect x="945" y="53" width="144" height="144" rx="24" fill="none" stroke="#E0A663" stroke-opacity=".23"/>
    <g transform="translate(948 56) scale(.85)" fill="none" stroke="#FFD389" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"><path d="m51 53-30 30 30 30 M111 53l30 30-30 30 M94 42l-27 82"/></g>
    <rect x="61" y="246" width="125" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <rect x="1" y="1" width="1198" height="258" rx="26" fill="none" stroke="#E0A663" stroke-opacity=".42"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="61" y="55" fill="#FFD389" font-size="15" font-weight="750" letter-spacing="3">DEV TOOLS</text>
    <text x="58" y="123" fill="#FCFDFF" font-size="64" font-weight="760" letter-spacing="-1.3">Vagrant UI</text>
    <text x="62" y="165" fill="#D6DFEE" font-size="24">A desktop interface for Vagrant.</text>
    <rect x="61" y="193" width="105" height="34" rx="17" fill="#FFFFFF" fill-opacity=".08" stroke="#E0A663" stroke-opacity=".39"/><text x="79" y="215" fill="#E8EDF5" font-size="15" font-weight="600">Electron</text><rect x="177" y="193" width="61" height="34" rx="17" fill="#FFFFFF" fill-opacity=".08" stroke="#E0A663" stroke-opacity=".39"/><text x="195" y="215" fill="#E8EDF5" font-size="15" font-weight="600">Vue</text><rect x="249" y="193" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity=".08" stroke="#E0A663" stroke-opacity=".39"/><text x="267" y="215" fill="#E8EDF5" font-size="15" font-weight="600">Vagrant</text>
  </g>
</svg>
