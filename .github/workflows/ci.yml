name: "Validation"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: "Desktop process tests"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 18
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Compile and run headless process tests in Docker"
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --init \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            node:22-bookworm-slim sh /src/tests/node/container.sh | tee -a "$GITHUB_STEP_SUMMARY"
